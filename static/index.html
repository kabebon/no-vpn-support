<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Служба поддержки VPN</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container { display: flex; flex-direction: column; height: 100vh; background: #ffffff; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 70%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; position: relative; }
        .msg.support { background: #f9f9f9; align-self: flex-start; border: 1px solid rgba(0,0,0,0.05); color: #111; }
        .msg.client { background: #111; color: #fff; align-self: flex-end; }
        .msg-time { font-size: 10px; opacity: 0.6; margin-top: 4px; display: block; text-align: right; }
        .chat-input-area { padding: 24px; border-top: 1px solid rgba(0,0,0,0.05); background: #fff; }
        .system-msg { align-self: center; font-size: 12px; color: #888; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="text-caption" style="font-weight: 600;">VPN Support</h1>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-item" style="background: rgba(0,0,0,0.05);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Онлайн чат
            </a>
            <a href="/" class="sidebar-item text-hollow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Личный кабинет
            </a>
        </nav>
        <div class="sidebar-footer">
            <p class="text-caption text-hollow" id="status-indicator">🔴 Подключение к серверу...</p>
        </div>
    </div>

    <main class="main-column chat-container">
        <div id="chat-messages" class="chat-messages">
            <div class="system-msg">Добро пожаловать в службу поддержки! Опишите вашу проблему, и оператор ответит вам здесь.</div>
        </div>
        
        <div class="chat-input-area">
            <div id="email-prompt" style="margin-bottom: 12px;">
                <input type="email" id="email" class="form-input" placeholder="Ваш Email (Обязательно, чтобы ответ пришел на почту, если вы закроете чат)" style="font-size: 14px; background: #fafafa;">
            </div>
            <form id="chat-form" style="display: flex; gap: 12px;">
                <input type="text" id="message" class="form-input" placeholder="Напишите сообщение..." style="flex: 1;" autocomplete="off">
                <button type="submit" class="btn-primary" style="padding: 0 24px;">Отправить</button>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
