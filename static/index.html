<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Служба поддержки KabebaVPN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header" style="display: flex; align-items: center; gap: 12px; padding-bottom: 20px;">
            <img src="https://kabeba.my.id/logo.svg" alt="Logo" style="width: 32px; height: 32px; border-radius: 8px; background: #111; padding: 4px; object-fit: contain;" onerror="this.src='logo.jpg'">
            <h1 class="text-caption" style="font-weight: 600; margin: 0; line-height: 1.2;">KabebaVPN<br><span style="opacity: 0.6; font-size: 12px;">Support</span></h1>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-item">
                <!-- SVG Icon for "New Chat" -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Новое обращение
            </a>
            <a href="#" class="sidebar-item text-hollow" onclick="alert('История доступна в личном кабинете')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Мои тикеты
            </a>
        </nav>
        <div class="sidebar-footer">
            <p class="text-caption text-hollow">Ответы отправляются на ваш Email. Для мгновенной помощи воспользуйтесь виджетом чата в правом нижнем углу.</p>
            <a href="/" class="btn-primary" style="width: 100%; margin-top: 10px;">В кабинет</a>
        </div>
    </div>

    <main class="main-column">
        <div class="content-wrapper">
            <div>
                <h1>Связь со службой поддержки</h1>
                <p class="text-body text-hollow" style="margin-top: 6px;">
                    Оставьте свое обращение здесь, и мы пришлем вам ответ на почту. Не требуется Telegram.
                </p>
            </div>

            <div class="card" style="padding: 24px;">
                <form id="support-form" style="display: flex; flex-direction: column; gap: 24px;">
                    <div id="form-alert" class="alert"></div>

                    <div class="form-group">
                        <label for="email" class="form-label">Ваш Email (для получения ответа)</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="user@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="tg_username" class="form-label">Логин в Telegram или Кабинете (опционально, для поиска подписки)</label>
                        <input type="text" id="tg_username" name="tg_username" class="form-input" placeholder="@username">
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">Опишите проблему</label>
                        <textarea id="message" name="message" class="form-textarea" placeholder="Не подключается через провайдера X..." required></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary">Отправить заявку</button>
                </form>
            </div>
        </div>
    </main>

    <script src="app.js"></script>

    <!-- Chatwoot Integration Placeholder -->
    <script>
        window.chatwootSettings = {"position":"right","type":"standard","launcherTitle":"Чат с поддержкой"};
        (function(d,t) {
            // Раскомментируйте и добавьте ваш BASE_URL и WEBSITE_TOKEN после установки Chatwoot
            /*
            var BASE_URL="https://chatwoot.yourdomain.com";
            var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
            g.src=BASE_URL+"/packs/js/sdk.js";
            g.defer = true;
            g.async = true;
            s.parentNode.insertBefore(g,s);
            g.onload=function(){
                window.chatwootSDK.run({
                    websiteToken: 'YOUR_WEBSITE_TOKEN',
                    baseUrl: BASE_URL
                })
            }
            */
        })(document,"script");
    </script>
</body>
</html>
